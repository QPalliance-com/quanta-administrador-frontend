<ng-container *ngIf="user">
    <div class="card flex flex-col gap-6 w-full max-w-xl mx-auto">
        <div class="flex items-center gap-4">
            <img [src]="user.imageUrl || 'assets/images/avatar.png'" alt="avatar" class="rounded-full w-20 h-20 object-cover border" />
            <div>
                <h2 class="text-2xl font-semibold">{{ user.names }} {{ user.lastNames }}</h2>
                <span class="text-gray-500">{{ user.position || 'Usuario' }}</span>
                <span class="ml-2 px-2 py-1 rounded text-xs" [ngClass]="user.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
                    {{ user.status === 'active' ? 'Activo' : 'Inactivo' }}
                </span>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <div class="text-base">{{ user.email }}</div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                <div class="text-base">{{ user.phone }}</div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
                <div class="text-base">ID: {{ user.roleId }}</div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Idioma</label>
                <div class="text-base">{{ user.language || 'es' }}</div>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de usuario</label>
                <div class="text-base">{{ user.userType }}</div>
            </div>
        </div>
    </div>
</ng-container>
