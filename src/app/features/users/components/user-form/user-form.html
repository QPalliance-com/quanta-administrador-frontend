<p-toast></p-toast>
<div class="card flex flex-col gap-6 w-full">
    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
        Usuario
        <i class="pi pi-info-circle text-blue-500" pTooltip="Completa los datos del usuario. Usa los tooltips para ayuda en cada campo." tooltipPosition="right"></i>
    </h2>
    <div class="bg-blue-50 border-l-4 border-blue-400 p-3 rounded text-blue-800 text-sm flex items-center gap-2 mb-4">
        <i class="pi pi-info-circle"></i>
        Ingresa los datos personales, estado y rol del usuario. Todos los campos son obligatorios.
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Nombres
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Nombres del usuario." tooltipPosition="right"></i>
                </label>
                <input id="names" pInputText formControlName="names" class="w-full" placeholder="Ingrese nombres" pTooltip="Nombres" tooltipPosition="top" />
                <small *ngIf="form.get('names')?.invalid && form.get('names')?.touched" class="text-red-500"> El nombre es requerido </small>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Apellidos
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Apellidos del usuario." tooltipPosition="right"></i>
                </label>
                <input id="lastNames" pInputText formControlName="lastNames" class="w-full" placeholder="Ingrese apellidos" pTooltip="Apellidos" tooltipPosition="top" />
                <small *ngIf="form.get('lastNames')?.invalid && form.get('lastNames')?.touched" class="text-red-500"> Los apellidos son requeridos </small>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Correo electrónico
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Correo electrónico del usuario." tooltipPosition="right"></i>
                </label>
                <input id="email" pInputText type="email" formControlName="email" class="w-full" placeholder="Ingrese correo" pTooltip="Correo electrónico" tooltipPosition="top" />
                <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500"> El correo es requerido y debe ser válido </small>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Teléfono
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Teléfono de contacto." tooltipPosition="right"></i>
                </label>
                <input id="phone" pInputText formControlName="phone" class="w-full" placeholder="Ingrese teléfono" pTooltip="Teléfono" tooltipPosition="top" />
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Estado
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Estado del usuario." tooltipPosition="right"></i>
                </label>
                <p-select
                    id="status"
                    formControlName="status"
                    [options]="[
                        { label: 'Activo', value: 'active' },
                        { label: 'Inactivo', value: 'inactive' }
                    ]"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Selecciona estado"
                    class="w-full"
                    pTooltip="Estado"
                    tooltipPosition="top"
                ></p-select>
                <small *ngIf="form.get('status')?.invalid && form.get('status')?.touched" class="text-red-500"> El estado es requerido </small>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Rol
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Rol asignado al usuario." tooltipPosition="right"></i>
                </label>
                <input id="roleId" pInputText type="number" formControlName="roleId" class="w-full" placeholder="ID de rol" pTooltip="Rol" tooltipPosition="top" />
                <small *ngIf="form.get('roleId')?.invalid && form.get('roleId')?.touched" class="text-red-500"> El rol es requerido </small>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Tipo de usuario
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Tipo de usuario (no editable)." tooltipPosition="right"></i>
                </label>
                <input id="userType" pInputText formControlName="userType" class="w-full" placeholder="Tipo de usuario" pTooltip="Tipo de usuario" tooltipPosition="top" />
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Cargo
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Cargo o posición." tooltipPosition="right"></i>
                </label>
                <input id="position" pInputText formControlName="position" class="w-full" placeholder="Cargo" pTooltip="Cargo" tooltipPosition="top" />
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Imagen de perfil
                    <i class="pi pi-info-circle text-gray-400" pTooltip="URL de la imagen de perfil." tooltipPosition="right"></i>
                </label>
                <input id="imageUrl" pInputText formControlName="imageUrl" class="w-full" placeholder="URL de imagen" pTooltip="Imagen de perfil" tooltipPosition="top" />
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 flex items-center gap-2">
                    Idioma
                    <i class="pi pi-info-circle text-gray-400" pTooltip="Idioma preferido." tooltipPosition="right"></i>
                </label>
                <p-select
                    id="language"
                    formControlName="language"
                    [options]="[
                        { label: 'Español', value: 'es' },
                        { label: 'Inglés', value: 'en' }
                    ]"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Selecciona idioma"
                    class="w-full"
                    pTooltip="Idioma"
                    tooltipPosition="top"
                ></p-select>
            </div>
        </div>
        <div class="flex justify-end gap-4 pt-6 border-t mt-6">
            <button pButton type="button" class="p-button-secondary" (click)="cancel()" label="Cancelar" pTooltip="Cancelar y volver a la lista"></button>
            <button pButton type="submit" label="Guardar" [disabled]="form.invalid" pTooltip="Guardar usuario"></button>
        </div>
    </form>
</div>
