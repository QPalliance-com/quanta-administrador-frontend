<p-drawer
    [visible]="visible"
    (visibleChange)="onVisibleChange($event)"
    position="right"
    [modal]="true"
    [style]="{ width: '480px' }"
>
    <ng-template #header>
        <span class="font-semibold text-base flex items-center gap-2">
            <i class="pi pi-calendar-plus text-primary"></i>
            {{ title }}
        </span>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5 pt-2 h-full">
        <p-message *ngIf="inlineError" severity="error" [text]="inlineError" styleClass="w-full" />

        <fieldset class="border border-surface-200 dark:border-surface-700 p-5 rounded-xl">
            <legend class="text-xs font-semibold text-surface-500 dark:text-surface-400 uppercase tracking-wider px-2">
                Detalle del festivo
            </legend>
            <div class="flex flex-col gap-4 mt-2">
                <div class="flex flex-col gap-1">
                    <label for="holidayDate" class="text-sm font-medium text-surface-700 dark:text-surface-200">
                        Fecha <span class="text-red-500">*</span>
                    </label>
                    <p-datepicker
                        fluid
                        inputId="holidayDate"
                        formControlName="holidayDate"
                        dateFormat="dd/mm/yy"
                        [showIcon]="true"
                        appendTo="body"
                        [class.ng-invalid]="isInvalid('holidayDate')"
                        [class.ng-dirty]="isInvalid('holidayDate')"
                    />
                    <small *ngIf="isInvalid('holidayDate')" class="text-red-500 flex items-center gap-1">
                        <i class="pi pi-exclamation-circle text-xs"></i>{{ getError('holidayDate') }}
                    </small>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="name" class="text-sm font-medium text-surface-700 dark:text-surface-200">
                        Nombre <span class="text-red-500">*</span>
                    </label>
                    <input
                        pInputText
                        fluid
                        id="name"
                        formControlName="name"
                        maxlength="100"
                        placeholder="Ej: Día de la Independencia"
                        [class.ng-invalid]="isInvalid('name')"
                        [class.ng-dirty]="isInvalid('name')"
                    />
                    <small *ngIf="isInvalid('name')" class="text-red-500 flex items-center gap-1">
                        <i class="pi pi-exclamation-circle text-xs"></i>{{ getError('name') }}
                    </small>
                </div>

                <div *ngIf="mode === 'edit'" class="flex items-center gap-3">
                    <p-toggleswitch formControlName="isActive" inputId="isActive" />
                    <label for="isActive" class="text-sm font-medium text-surface-700 dark:text-surface-200">Activo</label>
                </div>
            </div>
        </fieldset>

        <div class="flex items-center justify-between pt-2 border-t border-surface-100 dark:border-surface-800 mt-auto">
            <small class="text-surface-400 flex items-center gap-1">
                <span class="text-red-500">*</span> Campos requeridos
            </small>
            <div class="flex gap-2">
                <p-button label="Cancelar" severity="secondary" [outlined]="true" type="button" (onClick)="cancel()" />
                <p-button label="Guardar" icon="pi pi-check" type="submit" [loading]="(loading$ | async) ?? false" [disabled]="form.invalid" />
            </div>
        </div>
    </form>
</p-drawer>
