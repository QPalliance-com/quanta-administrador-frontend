<div class="card">
    <p-menu #rowMenu [popup]="true" [model]="rowMenuItems" appendTo="body" />

    <p-table
        *ngIf="licences$ | async as licences"
        #licencesTable
        [value]="licences"
        [paginator]="true"
        [globalFilterFields]="filterFields"
        [rows]="15"
        [columns]="cols"
        [resizableColumns]="true"
        [scrollable]="true"
        scrollHeight="flex"
        [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '50rem' }"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
        styleClass="p-datatable-sm"
    >
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="font-semibold text-xl">Licencias</span>
                    <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-surface-100 dark:bg-surface-700 text-surface-500 dark:text-surface-300">
                        {{ licences.length }} registros
                    </span>
                </div>
                <input pInputText type="text" (input)="onGlobalFilter(licencesTable, $event)" placeholder="Buscar..." class="text-sm" />
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th *ngFor="let col of cols" pResizableColumn [pSortableColumn]="col.field">
                    <div class="flex items-center gap-1">
                        <span [pTooltip]="colTooltips[col.field]" tooltipPosition="top">{{ col.header }}</span>
                        <p-sortIcon [field]="col.field" />
                    </div>
                </th>
                <th style="width: 3rem"></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-licence>
            <tr class="group/row transition-colors hover:bg-primary/10 dark:hover:bg-primary/10 border-l-2 border-l-transparent hover:border-l-primary">
                <td>
                    <span class="font-medium">{{ formatPlanName(licence.licences) }}</span>
                </td>
                <td>
                    <span class="font-semibold text-primary">${{ licence.amountUsd | number: '1.2-2' }}</span>
                </td>
                <td>
                    <span class="text-surface-700 dark:text-surface-300">{{ licence.currency }}</span>
                </td>
                <td class="text-center">
                    <button
                        pButton
                        icon="pi pi-ellipsis-v"
                        severity="secondary"
                        [text]="true"
                        [rounded]="true"
                        size="small"
                        class="opacity-0 group-hover/row:opacity-100 transition-opacity"
                        (click)="openRowMenu($event, licence)"
                        pTooltip="Más opciones"
                        tooltipPosition="left"
                    ></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td [attr.colspan]="cols.length + 1" class="text-center text-surface-400 py-12">
                    <i class="pi pi-inbox text-4xl mb-3 block"></i>
                    <span>No hay planes registrados.</span>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div *ngIf="error$ | async as error" class="text-red-500 text-sm text-center py-2">
        {{ error }}
    </div>
</div>

<p-dialog
    [(visible)]="displayPriceDialog"
    [modal]="true"
    [style]="{ width: '360px' }"
    [header]="'Actualizar precio — ' + (selectedLicence ? formatPlanName(selectedLicence.licences) : '')"
    [draggable]="false"
    [resizable]="false"
>
    <form [formGroup]="priceForm" (ngSubmit)="submitPrice()" class="flex flex-col gap-4 pt-2">
        <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-surface-700 dark:text-surface-200">Precio USD</label>
            <p-inputNumber
                formControlName="amount"
                mode="currency"
                currency="USD"
                locale="en-US"
                [minFractionDigits]="2"
                [min]="0"
                class="w-full"
                [ngClass]="{ 'ng-invalid ng-dirty': priceForm.get('amount')?.invalid && priceForm.get('amount')?.touched }"
            />
            <small *ngIf="priceForm.get('amount')?.invalid && priceForm.get('amount')?.touched" class="text-red-500">
                Ingresa un monto válido
            </small>
        </div>
    </form>

    <ng-template #footer>
        <p-button
            label="Cancelar"
            severity="secondary"
            [outlined]="true"
            (onClick)="displayPriceDialog = false"
        />
        <p-button
            label="Guardar"
            icon="pi pi-check"
            [loading]="(loading$ | async) ?? false"
            [disabled]="priceForm.invalid"
            (onClick)="submitPrice()"
        />
    </ng-template>
</p-dialog>

<p-toast />
